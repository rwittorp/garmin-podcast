name: Update podcast feed

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch: {}  # manual trigger button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 proxy/fetch.py --out feed/episodes.json --limit 10
      - run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed/episodes.json
          git diff --cached --quiet || git commit -m "Update episodes.json"
          git push
